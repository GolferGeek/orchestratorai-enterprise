# OrchestratorAI Enterprise — unified platform runtime
# Usage:
#   docker compose build
#   docker compose up -d
#
# Loads .env from the project directory and optional .env.secrets.
# For Supabase on the host while the API runs in Docker, set DATABASE_URL and
# SUPABASE_URL to host.docker.internal in .env. See .env.example.

x-platform-api-env: &platform-api-env
  env_file:
    - .env
    - path: .env.secrets
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  platform-api:
    <<: *platform-api-env
    build:
      context: .
      dockerfile: docker/nest-api.Dockerfile
      args:
        TURBO_FILTER: "@orchestratorai/platform-api"
        APP_DIR: apps/api
    ports:
      - "${PLATFORM_API_PORT:-6700}:6700"
    environment:
      - PLATFORM_API_PORT=6700

  platform-web:
    build:
      context: .
      dockerfile: docker/vite-web.Dockerfile
      args:
        TURBO_FILTER: "@orchestratorai/platform-web"
        APP_DIR: apps/web
        NGINX_CONF: docker/nginx-platform-web.conf
        VITE_API_BASE_URL: /api
        VITE_MONOLITH_MODE: "true"
    ports:
      - "${VITE_PLATFORM_WEB_PORT:-6701}:80"
    depends_on:
      - platform-api

  # Lightning Network (regtest) — optional demo infrastructure.
  # Start with:
  #   docker compose --profile lightning up -d bitcoind lnd lnd-init bitcoind-miner
  bitcoind:
    image: lncm/bitcoind:v27.0
    restart: unless-stopped
    profiles: ["lightning"]
    command:
      - -regtest
      - -server
      - -rpcuser=dev
      - -rpcpassword=dev
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
      - -fallbackfee=0.00001
      - -txindex=1
    volumes:
      - bitcoind-data:/root/.bitcoin

  lnd:
    image: lightninglabs/lnd:v0.18.4-beta
    restart: unless-stopped
    profiles: ["lightning"]
    depends_on:
      - bitcoind
    command:
      - --noseedbackup
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind
      - --bitcoind.rpcuser=dev
      - --bitcoind.rpcpass=dev
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      - --restlisten=0.0.0.0:8080
      - --rpclisten=0.0.0.0:10009
      - --tlsextradomain=lnd
      - --tlsextraip=0.0.0.0
    ports:
      - "6108:8080"
      - "6109:10009"
    volumes:
      - lnd-data:/root/.lnd
      - shared-data:/shared

  lnd-init:
    image: lightninglabs/lnd:v0.18.4-beta
    profiles: ["lightning"]
    depends_on:
      - lnd
    entrypoint: ["/bin/sh", "/scripts/lnd-init.sh"]
    volumes:
      - lnd-data:/root/.lnd:ro
      - shared-data:/shared
      - ./scripts/lnd-init.sh:/scripts/lnd-init.sh:ro

  bitcoind-miner:
    image: lncm/bitcoind:v27.0
    profiles: ["lightning"]
    depends_on:
      - bitcoind
      - lnd-init
    entrypoint: ["/bin/sh", "/scripts/bitcoind-miner.sh"]
    volumes:
      - shared-data:/shared
      - ./scripts/bitcoind-miner.sh:/scripts/bitcoind-miner.sh:ro

volumes:
  bitcoind-data:
  lnd-data:
  shared-data:
