# Google Cloud Build — deploy monolith images to Cloud Run (prod).
#
# Service names match Terraform: orchestrator-ai-prod-api / orchestrator-ai-prod-web

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'orchestrator-ai-prod-docker'
  _IMAGE_TAG: 'latest'
  _API_SERVICE: 'orchestrator-ai-prod-api'
  _WEB_SERVICE: 'orchestrator-ai-prod-web'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: 'deploy-api-prod'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_API_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/orchestratorai-api:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'
      - '--timeout'
      - '300'
      - '--update-env-vars'
      - 'NODE_ENV=production,PLATFORM_API_PORT=8080,DB_PROVIDER=postgresql,AUTH_PROVIDER=google_oidc,STORAGE_PROVIDER=gcs,CONFIG_PROVIDER=gcp_secret_manager,RAG_PROVIDER=postgresql,LLM_PROVIDER=openrouter,OBSERVABILITY_PROVIDER=database_events,WORK_PROVIDER=slack'

  - id: 'deploy-web-prod'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_WEB_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/orchestratorai-web:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'
      - '--timeout'
      - '60'
      - '--allow-unauthenticated'

  - id: 'verify-api-prod'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        API_URL=$(gcloud run services describe ${_API_SERVICE} \
          --region=${_REGION} --format='value(status.url)')
        echo "Checking health at $${API_URL}/health ..."
        RETRIES=0
        until [ $$RETRIES -ge 20 ]; do
          STATUS=$$(curl -s -o /dev/null -w "%{http_code}" "$${API_URL}/health" 2>/dev/null || echo "000")
          if [ "$$STATUS" = "200" ]; then
            echo "API health check passed"
            exit 0
          fi
          RETRIES=$$((RETRIES + 1))
          echo "Attempt $$RETRIES/20 - HTTP $$STATUS"
          sleep 10
        done
        echo "API health check failed"
        exit 1
    waitFor: ['deploy-api-prod']

timeout: '600s'
