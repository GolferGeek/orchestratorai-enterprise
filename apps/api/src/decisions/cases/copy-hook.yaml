rubric: copy-hook
cases:
  - name: names their pain
    expect:
      - pass
    state:
      draft: Your AWS bill went up 31% last quarter and nobody can tell you which team did it. Spendline shows
        finance and engineering the same cloud cost numbers, per team and per service. Free for 14 days; book
        a demo and bring your own bill.
      brief: "Content type: LinkedIn post (100-250 words). Audience: finance leaders (CFOs, FP&A heads) at mid-size
        SaaS companies. Brand voice: warm, direct, plain-spoken, no hype. Keywords: cloud cost, FinOps. Brief:
        announce Spendline, our new cloud cost dashboard that shows finance and engineering the same numbers.
        Must mention the free 14-day trial. Goal: readers book a demo."
  - name: throat-clearing opener
    expect:
      - block
    state:
      draft: In today's fast-paced digital landscape, organizations face many challenges. Cloud cost management is
        one of them. Spendline helps finance and engineering work together on FinOps. Start a free 14-day
        trial or book a demo.
      brief: "Content type: LinkedIn post (100-250 words). Audience: finance leaders (CFOs, FP&A heads) at mid-size
        SaaS companies. Brand voice: warm, direct, plain-spoken, no hype. Keywords: cloud cost, FinOps. Brief:
        announce Spendline, our new cloud cost dashboard that shows finance and engineering the same numbers.
        Must mention the free 14-day trial. Goal: readers book a demo."
  - name: announcement opener
    expect:
      - block
      - review
    state:
      draft: Today we are launching Spendline. It is a cloud cost dashboard that gives finance and engineering the
        same numbers, so FinOps reviews stop being arguments. Free for 14 days - book a demo.
      brief: "Content type: LinkedIn post (100-250 words). Audience: finance leaders (CFOs, FP&A heads) at mid-size
        SaaS companies. Brand voice: warm, direct, plain-spoken, no hype. Keywords: cloud cost, FinOps. Brief:
        announce Spendline, our new cloud cost dashboard that shows finance and engineering the same numbers.
        Must mention the free 14-day trial. Goal: readers book a demo."
