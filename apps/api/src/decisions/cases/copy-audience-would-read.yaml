rubric: copy-audience-would-read
cases:
  - name: earns the read
    expect:
      - pass
    state:
      draft: "Last quarter a CFO told us her cloud forecast was 'engineering's spreadsheet plus a prayer.' That is
        why we built Spendline: finance and engineering see the same cloud cost numbers, by team and service,
        updated daily. The first review after switching took 20 minutes instead of two hours. Try it free for
        14 days, or book a demo and bring your own bill."
      brief: "Content type: LinkedIn post (100-250 words). Audience: finance leaders (CFOs, FP&A heads) at mid-size
        SaaS companies. Brand voice: warm, direct, plain-spoken, no hype. Keywords: cloud cost, FinOps. Brief:
        announce Spendline, our new cloud cost dashboard that shows finance and engineering the same numbers.
        Must mention the free 14-day trial. Goal: readers book a demo."
  - name: padded and dull
    expect:
      - block
    state:
      draft: Cloud computing has become increasingly important for businesses of all sizes over the past decade. As
        organizations move more workloads to the cloud, costs can increase. There are many tools available on
        the market. Spendline is one such tool. It provides dashboards. It has various features. It can be
        used by finance teams and engineering teams. It offers a 14-day trial. A demo can be booked.
      brief: "Content type: LinkedIn post (100-250 words). Audience: finance leaders (CFOs, FP&A heads) at mid-size
        SaaS companies. Brand voice: warm, direct, plain-spoken, no hype. Keywords: cloud cost, FinOps. Brief:
        announce Spendline, our new cloud cost dashboard that shows finance and engineering the same numbers.
        Must mention the free 14-day trial. Goal: readers book a demo."
  - name: fine but flat
    expect:
      - pass
      - review
      - block
    state:
      draft: Spendline is a new cloud cost dashboard for finance and engineering teams. It shows spend by team and
        service so both teams work from the same numbers. You can try it free for 14 days or book a demo with
        our team.
      brief: "Content type: LinkedIn post (100-250 words). Audience: finance leaders (CFOs, FP&A heads) at mid-size
        SaaS companies. Brand voice: warm, direct, plain-spoken, no hype. Keywords: cloud cost, FinOps. Brief:
        announce Spendline, our new cloud cost dashboard that shows finance and engineering the same numbers.
        Must mention the free 14-day trial. Goal: readers book a demo."
