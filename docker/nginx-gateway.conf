# OrchestratorAI Gateway — unified platform reverse proxy.
# One web frontend and one API backend are served from a single origin.

upstream platform_web {
    server platform-web:80;
}

upstream platform_api {
    server platform-api:6700;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # OAuth discovery for "Log in with <company>" (the Gatehouse): RFC 8414
    # authorization server metadata, and RFC 9728 metadata for each protected
    # endpoint, at the origin's /.well-known/ as clients look for them.
    # (A regex location cannot give proxy_pass a path: rewrite, then pass.)
    location ~ ^/\.well-known/oauth-authorization-server(/.*)?$ {
        rewrite ^ /gatehouse/oauth/metadata break;
        proxy_pass http://platform_api;
    }
    location ~ ^/\.well-known/oauth-protected-resource/api/a2a/([a-z0-9-]+)$ {
        rewrite ^/\.well-known/oauth-protected-resource/api/a2a/([a-z0-9-]+)$ /gatehouse/oauth/protected-resource/a2a/$1 break;
        proxy_pass http://platform_api;
    }

    location /api/ {
        proxy_pass http://platform_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
    }

    # Generated media: the API's asset route streams only objects that have an
    # asset record, sandboxed and nosniff. (This used to go straight to port
    # 54321, orchestratorai-local's Supabase, and /storage/ exposed that
    # project's whole storage API; neither belongs on this site.)
    # Only /assets/storage/: the rest of /assets/ is the web app's own build
    # (its JavaScript and CSS). Sending all of /assets/ to the API blanked the
    # web app from 2026-10-01 (ce208748) to 2026-10-06.
    location /assets/storage/ {
        proxy_pass http://platform_api/assets/storage/;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://platform_web;
        proxy_http_version 1.1;
    }
}
