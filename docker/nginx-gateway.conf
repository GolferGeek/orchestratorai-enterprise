# OrchestratorAI Gateway — unified platform reverse proxy.
# One web frontend and one API backend are served from a single origin.

upstream platform_web {
    server platform-web:80;
}

upstream platform_api {
    server platform-api:6700;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://platform_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
    }

    location /assets/storage/ {
        proxy_pass http://host.docker.internal:54321/storage/v1/object/public/;
        proxy_http_version 1.1;
    }

    location /storage/ {
        proxy_pass http://host.docker.internal:54321/storage/;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://platform_web;
        proxy_http_version 1.1;
    }
}
