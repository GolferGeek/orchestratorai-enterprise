# Cloud Run web — static SPA only (API is a separate Cloud Run service).
# Browser calls the API via the absolute VITE_API_BASE_URL baked at image build.
# Cloud Run injects PORT (default 8080); we listen on that port.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
