# Cloud Run web — serves the static SPA and proxies /api to the API Cloud Run
# service so the browser only ever talks to one origin (no CORS needed).
# PLATFORM_API_ORIGIN (the API service host, no scheme) is injected at container
# start and substituted by the nginx entrypoint's envsubst step.
# Cloud Run injects PORT (default 8080); we listen on that port.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy. The API has no global /api prefix, so strip it and
    # forward the remainder to the API service over HTTPS with SNI.
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $api_origin "${PLATFORM_API_ORIGIN}";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://$api_origin;
        proxy_ssl_server_name on;
        proxy_set_header Host $api_origin;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
